services:
  postgres:
    image: postgres:16
    container_name: procurement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - procurement_pgdata:/var/lib/postgresql/data

volumes:
  procurement_pgdata: